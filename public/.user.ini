; PHP limits for the assistant's file uploads.
;
; The assistant reads brandbooks, and brandbooks are big. Gemini accepts a PDF
; up to 50MB inline (100MB for anything else), and App\Services\Ai\Data\Attachment
; enforces exactly that — but PHP refuses the upload long before the app gets a
; say. When post_max_size is exceeded PHP discards the WHOLE request body, which
; takes the CSRF token with it, so the browser gets a 419 and the screen says
; the assistant is unreachable. It is not; the file was simply too big to
; arrive. That failure cost an afternoon on 2026-08-13.
;
; ⚠️ .user.ini only applies when PHP runs as CGI/FastCGI, which is the usual
; cPanel setup. It does NOT apply to PHP as an Apache module, and it does not
; apply to `php artisan serve` or Herd locally — for local work these same
; values have to go in php.ini. Check with php -i | grep upload_max_filesize
; after deploying rather than assuming.
;
; ⚠️ iFastNet may cap these below what is asked for here. cPanel's MultiPHP INI
; Editor shows what is actually in force. If the host will not go to 50M, lower
; MAX_BYTES in Attachment to match — the browser check reads that constant, and
; two different limits is how you get the silent 419 back.

; One file, at the app's document ceiling.
upload_max_filesize = 50M

; The body carries up to four files plus the form. Kept deliberately larger
; than one file, and deliberately smaller than four: four 50MB brandbooks in a
; single turn is a timeout, not a better answer.
post_max_size = 120M

; base64 inflates an attachment by about a third on the way into the request
; body, and the JSON is assembled in memory. 50MB of PDF is ~67MB of base64
; before Laravel has done anything.
memory_limit = 512M

; A 50MB upload over a slow connection is minutes, not seconds. Both of these
; are counted from the start of the request.
max_input_time = 300
max_execution_time = 300
